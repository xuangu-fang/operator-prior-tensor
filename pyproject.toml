[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "operator-prior-tensor"
version = "0.1.0"
description = "Operator-informed Bayesian functional tensor research"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "torch>=2.4,<2.9",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

